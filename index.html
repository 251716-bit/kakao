<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 맛집 탐색 서비스</title>
    <style>
        /* 기본 레이아웃 설정 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; font-family: 'Malgun Gothic', sans-serif; }
        
        .container { display: flex; width: 100%; height: 100%; }

        /* 왼쪽 사이드바 스타일 */
        .sidebar {
            width: 350px; height: 100%; background: #fff;
            display: flex; flex-direction: column; border-right: 1px solid #ccc;
            z-index: 2;
        }

        .search-box { padding: 20px; border-bottom: 1px solid #eee; }
        .search-form { display: flex; gap: 5px; margin-top: 10px; }
        .search-input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        .search-button { padding: 10px 15px; background: #fee500; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }

        /* 검색 결과 리스트 스타일 */
        #placesList { flex: 1; overflow-y: auto; padding: 10px; }
        .place-item { padding: 15px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        .place-item:hover { background-color: #f9f9f9; }
        .place-item h5 { color: #333; margin-bottom: 5px; font-size: 15px; }
        .place-item p { font-size: 12px; color: #777; }

        /* 오른쪽 지도 영역 */
        .map-area { flex: 1; height: 100%; }

        /* 이모지 마커 스타일 추가 */
        .emoji-marker {
            font-size: 28px;
            cursor: pointer;
            animation: bounce 0.5s ease infinite alternate; /* 귀여운 통통 튀는 효과 */
        }
        @keyframes bounce {
            import { transform: translateY(0); }
            to { transform: translateY(-5px); }
        }

        /* 인포윈도우(팝업) 커스텀 스타일 */
        .info-window {
            padding: 10px;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 12px;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.2);
        }
        .info-window h4 { margin-bottom: 3px; color: #333; font-size: 13px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <div class="search-box">
                <h3>📍 맛집 탐색</h3>
                <div class="search-form">
                    <input type="text" id="keyword" class="search-input" placeholder="음식, 동네, 키워드 입력" onkeypress="if(event.keyCode==13) searchPlaces()">
                    <button onclick="searchPlaces()" class="search-button">검색</button>
                </div>
            </div>
            <div id="placesList"></div>
        </div>
        <div id="map" class="map-area"></div>
    </div>

    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=fa1a5e0e6d5309f6ae682b37eab50ca7&libraries=services&autoload=false"></script>
    
    <script>
        let map;
        let placesService;
        let customOverlays = []; // 이모지 마커(CustomOverlay)들을 관리할 배열
        let activeInfoWindow = null; // 현재 열려있는 팝업창을 기억할 변수

        // 안전한 지도 로딩 보장
        kakao.maps.load(function() {
            const mapContainer = document.getElementById('map');
            const mapOption = {
                center: new kakao.maps.LatLng(37.566826, 126.9786567), // 기본 위치 (서울시청)
                level: 5
            };

            map = new kakao.maps.Map(mapContainer, mapOption);
            placesService = new kakao.maps.Services.Places();

            // 현재 위치 권한 요청 및 중심점 이동
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const currentPos = new kakao.maps.LatLng(lat, lon);
                    
                    map.setCenter(currentPos);
                });
            }
        });

        // 장소 검색 함수
        function searchPlaces() {
            const keyword = document.getElementById('keyword').value;

            if (!keyword.replace(/^\s+|\s+$/g, '')) {
                alert('키워드를 입력해주세요!');
                return;
            }

            // 카카오 키워드 검색 서비스 호출
            placesService.keywordSearch(keyword, placesSearchCB);
        }

        // 검색 완료 콜백 함수
        function placesSearchCB(data, status, pagination) {
            if (status === kakao.maps.Services.Status.OK) {
                displayPlaces(data);
            } else if (status === kakao.maps.Services.Status.ZERO_RESULT) {
                alert('검색 결과가 존재하지 않습니다.');
            } else if (status === kakao.maps.Services.Status.ERROR) {
                alert('검색 결과 중 오류가 발생했습니다.');
            }
        }

        // 검색 결과를 화면과 지도에 그리는 함수
        function displayPlaces(places) {
            const listEl = document.getElementById('placesList');
            const bounds = new kakao.maps.LatLngBounds(); 

            listEl.innerHTML = ''; // 왼쪽 리스트 초기화
            clearMap(); // 지도 위의 기존 이모지 마커 및 팝업 초기화

            for (let i = 0; i < places.length; i++) {
                const placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
                
                // 맛집 탐색에 어울리는 이모지 마커 생성
                const emojiOverlay = addEmojiMarker(placePosition, places[i]); 
                const itemEl = getListItem(i, places[i]); 

                bounds.extend(placePosition);

                // 리스트 아이템 클릭 시 지도 이동 및 팝업 오픈
                itemEl.onclick = function() {
                    map.panTo(placePosition);
                    openInfoWindow(placePosition, places[i]);
                };

                listEl.appendChild(itemEl);
            }

            // 검색된 맛집들이 한눈에 들어오도록 지도 범위 맞춤
            map.setBounds(bounds);
        }

        // 이모지 마커 생성 함수 (CustomOverlay 활용)
        function addEmojiMarker(position, place) {
            const content = document.createElement('div');
            content.className = 'emoji-marker';
            content.innerHTML = '📌'; // 맛집 탐색용 핀 이모지 (🍔, 🍕 등으로 변경 가능)

            // 이모지를 클릭했을 때 팝업창이 뜨도록 이벤트 리스너 추가
            content.onclick = function() {
                openInfoWindow(position, place);
            };

            const customOverlay = new kakao.maps.CustomOverlay({
                position: position,
                content: content,
                yAnchor: 1 // 이모지 하단이 좌표에 딱 맞게 정렬
            });

            customOverlay.setMap(map);
            customOverlays.push(customOverlay); // 배열에 저장하여 추후 삭제 가능하게 함
            return customOverlay;
        }

        // 이름과 주소를 보여주는 팝업(InfoWindow) 생성 및 오픈 함수
        function openInfoWindow(position, place) {
            // 이미 열려있는 팝업이 있다면 먼저 닫기
            if (activeInfoWindow) {
                activeInfoWindow.close();
            }

            const address = place.road_address_name || place.address_name;
            const content = `
                <div class="info-window">
                    <h4>${place.place_name}</h4>
                    <p>${address}</p>
                </div>
            `;

            const infoWindow = new kakao.maps.InfoWindow({
                position: position,
                content: content,
                removable: true // 사용자가 X 버튼을 눌러 닫을 수 있게 설정
            });

            infoWindow.open(map);
            activeInfoWindow = infoWindow; // 현재 열린 팝업으로 기록
        }

        // 기존 마커 및 팝업을 지도에서 완전히 제거하는 함수
        function clearMap() {
            // 이모지 마커 삭제
            for (let i = 0; i < customOverlays.length; i++) {
                customOverlays[i].setMap(null);
            }            
            customOverlays = [];

            // 열려있는 팝업창 삭제
            if (activeInfoWindow) {
                activeInfoWindow.close();
                activeInfoWindow = null;
            }
        }

        // 왼쪽 결과창 리스트 디자인 함수
        function getListItem(index, place) {
            const el = document.createElement('div');
            el.className = 'place-item';
            el.innerHTML = `
                <h5>${place.place_name}</h5>
                <p>${place.road_address_name || place.address_name}</p>
            `;
            return el;
        }
    </script>
</body>
</html>
