<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 장소 검색 서비스</title>
    <style>
        /* 기본 레이아웃 초기화 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; font-family: 'Malgun Gothic', sans-serif; }
        
        /* 화면을 좌우로 분할하는 전체 컨테이너 */
        .container { display: flex; width: 100%; height: 100%; }

        /* 왼쪽 사이드바 스타일 (검색창 + 검색 결과 리스트) */
        .sidebar {
            width: 350px; height: 100%; background: #fff;
            display: flex; flex-direction: column; border-right: 1px solid #ccc;
            z-index: 2;
        }

        /* 검색 박스 영역 */
        .search-box { padding: 20px; border-bottom: 1px solid #eee; }
        .search-form { display: flex; gap: 5px; margin-top: 10px; }
        .search-input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        .search-button { padding: 10px 15px; background: #fee500; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }

        /* 검색 결과 리스트 스타일 (스크롤 가능) */
        #placesList { flex: 1; overflow-y: auto; padding: 10px; }
        .place-item { padding: 15px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        .place-item:hover { background-color: #f9f9f9; }
        .place-item h5 { color: #333; margin-bottom: 5px; font-size: 15px; }
        .place-item p { font-size: 12px; color: #777; }

        /* 오른쪽 지도 영역 (로딩 전 백화 현상 인지를 위해 연한 회색 부여) */
        .map-area { flex: 1; height: 100%; background-color: #f5f5f5; }
    </style>
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <div class="search-box">
                <h3>장소 검색</h3>
                <div class="search-form">
                    <input type="text" id="keyword" class="search-input" placeholder="장소를 입력하세요" onkeypress="if(event.keyCode==13) searchPlaces()">
                    <button onclick="searchPlaces()" class="search-button">검색</button>
                </div>
            </div>
            <div id="placesList">
                <p style="color: #888; text-align: center; margin-top: 20px;">검색어를 입력해 주세요.</p>
            </div>
        </div>
        <div id="map" class="map-area"></div>
    </div>

    <script>
        let map;
        let placesService;
        let markers = []; // 생성된 마커들을 관리할 배열

        // [핵심 해결책] 깃허브 주소(https://elena.github.io) 환경에서 카카오 인증 실패를 막는 동적 로드 로직
        window.onload = function() {
            const script = document.createElement('script');
            
            // 1. 보안 프로토콜(https)을 명시하고 자동 로드를 비활성화(&autoload=false)합니다.
            // 2. 장소 검색에 필요한 &libraries=services 라이브러리를 정확한 순서로 결합합니다.
            script.src = "https://dapi.kakao.com/v2/maps/sdk.js?appkey=fa1a5e0e6d5309f6ae682b37eab50ca7&libraries=services&autoload=false";
            
            // 깃허브 배포 서버의 Referrer Policy 엄격성으로 인한 도메인 불일치 에러를 우회합니다.
            script.crossOrigin = "anonymous"; 
            
            // 스크립트 파일이 브라우저에 완전히 로드된 것이 보장되면 카카오 라이브러리 초기화를 유도합니다.
            script.onload = function() {
                if (typeof kakao !== 'undefined' && kakao.maps) {
                    kakao.maps.load(initializeMap);
                } else {
                    alert('카카오 지도 스크립트를 불러오지 못했습니다. 개발자 센터 도메인 설정을 확인해 주세요.');
                }
            };
            
            document.head.appendChild(script);
        };

        // 지도 초기화 함수
        function initializeMap() {
            const mapContainer = document.getElementById('map');
            const mapOption = {
                center: new kakao.maps.LatLng(37.566826, 126.9786567), // 위치 권한 허용 전 기본 화면 (서울시청)
                level: 5 // 지도 확대 레벨 5
            };

            // 지도를 생성합니다.
            map = new kakao.maps.Map(mapContainer, mapOption);
            placesService = new kakao.maps.Services.Places();

            // 위치 권한을 요청하여 허용 시 현재 위치로 중심점을 이동합니다.
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;  
                        const lon = position.coords.longitude; 
                        const currentPos = new kakao.maps.LatLng(lat, lon);
                        
                        map.setCenter(currentPos);
                    },
                    function(error) {
                        console.log("위치 권한을 획득하지 못해 기본 위치(서울시청)로 유지합니다.", error);
                    },
                    { timeout: 7000 } // 7초 대기 후 응답 없으면 기본 지도로 유지
                );
            }
        }

        // 장소 검색 함수
        function searchPlaces() {
            const keyword = document.getElementById('keyword').value;

            if (!keyword.replace(/^\s+|\s+$/g, '')) {
                alert('키워드를 입력해주세요!');
                return;
            }

            // 지도 서비스가 비동기로 완전히 준비되지 않았을 때의 예외 처리
            if (!placesService) {
                alert('지도 서비스가 아직 준비되지 않았습니다. 잠시 후 다시 시도해 주세요!');
                return;
            }

            // 카카오 키워드 검색 서비스 호출
            placesService.keywordSearch(keyword, placesSearchCallback);
        }

        // 검색 완료 시 호출되는 콜백 함수
        function placesSearchCallback(data, status, pagination) {
            if (status === kakao.maps.Services.Status.OK) {
                displayPlaces(data);
            } else if (status === kakao.maps.Services.Status.ZERO_RESULT) {
                alert('검색 결과가 존재하지 않습니다.');
            } else if (status === kakao.maps.Services.Status.ERROR) {
                alert('검색 중 오류가 발생했습니다.');
            }
        }

        // 검색 결과 목록과 마커를 지도에 표시하는 함수
        function displayPlaces(places) {
            const listEl = document.getElementById('placesList');
            const bounds = new kakao.maps.LatLngBounds(); 

            listEl.innerHTML = ''; // 기존 결과 리스트 삭제
            removeMarkers(); // 지도 위의 기존 마커 삭제

            for (let i = 0; i < places.length; i++) {
                const placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
                const marker = addMarker(placePosition); 
                const itemEl = getListItem(i, places[i]); 

                bounds.extend(placePosition);

                // 리스트 아이템 클릭 시 해당 위치로 지도 중심 이동
                itemEl.onclick = function() {
                    map.panTo(placePosition);
                };

                listEl.appendChild(itemEl);
            }

            // 마커들이 한눈에 보이도록 지도 범위 조정
            map.setBounds(bounds);
        }

        // 마커 생성 및 지도 표시 함수
        function addMarker(position) {
            const marker = new kakao.maps.Marker({
                position: position
            });

            marker.setMap(map);
            markers.push(marker); 
            return marker;
        }

        // 기존 마커를 지도에서 모두 제거하는 함수
        function removeMarkers() {
            for (let i = 0; i < markers.length; i++) {
                markers[i].setMap(null);
            }            
            markers = [];
        }

        // 왼쪽 결과창 목록 디자인 엘리먼트 생성 함수
        function getListItem(index, place) {
            const el = document.createElement('div');
            el.className = 'place-item';
            el.innerHTML = `
                <h5>${place.place_name}</h5>
                <p>${place.road_address_name || place.address_name}</p>
            `;
            return el;
        }
    </script>
</body>
</html>
