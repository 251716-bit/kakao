<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐥 삐약삐약 맛집 탐색 지도 🐥</title>
    <style>
        /* 기본 레이아웃 및 폰트 설정 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; font-family: 'Malgun Gothic', sans-serif; background-color: #fff9e6; }
        
        .container { display: flex; width: 100%; height: 100%; }

        /* 왼쪽 사이드바 (귀여운 옐로우 테마) */
        .sidebar {
            width: 350px; height: 100%; background: #ffffff;
            display: flex; flex-direction: column; border-right: 2px border-image: linear-gradient(to bottom, #fee500, #ffb300) 1;
            z-index: 2;
            box-shadow: 3px 0 10px rgba(0,0,0,0.05);
        }

        /* 화사하고 귀여운 노란색 검색 박스 */
        .search-box { 
            padding: 25px 20px; 
            background: linear-gradient(135deg, #fffde6 0%, #fee500 100%); 
            border-bottom: 2px dashed #ffa100;
            text-align: center;
        }
        .search-box h3 { 
            color: #4a3b00; 
            margin-bottom: 5px; 
            font-size: 20px;
            letter-spacing: -0.5px;
        }
        .chick-decoration {
            font-size: 14px;
            color: #6b5600;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .search-form { display: flex; gap: 6px; }
        .search-input { 
            flex: 1; padding: 12px; 
            border: 2px solid #ffb300; border-radius: 20px; 
            outline: none; font-size: 14px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
        }
        .search-input:focus { border-color: #e69d00; background-color: #fffdf0; }
        .search-button { 
            padding: 0 18px; background: #ffb300; color: #fff;
            border: none; border-radius: 20px; cursor: pointer; 
            font-weight: bold; font-size: 15px; transition: all 0.2s;
            box-shadow: 0 3px 6px rgba(255,179,0,0.3);
        }
        .search-button:hover { background: #e69d00; transform: scale(1.03); }

        /* 검색 결과 맛집 리스트 스타일 */
        #placesList { flex: 1; overflow-y: auto; padding: 10px; background-color: #fffdf7; }
        .place-item { 
            padding: 15px; margin-bottom: 8px;
            border: 1px solid #ffe699; border-radius: 12px; background: #fff;
            cursor: pointer; transition: all 0.2s;
        }
        .place-item:hover { 
            background-color: #fff9e6; transform: translateY(-2px); 
            box-shadow: 0 4px 8px rgba(255, 230, 153, 0.4); 
        }
        .place-item h5 { color: #333; margin-bottom: 5px; font-size: 15px; display: flex; align-items: center; gap: 4px; }
        .place-item p { font-size: 12px; color: #666; line-height: 1.4; }

        /* 오른쪽 지도 영역 */
        .map-area { flex: 1; height: 100%; }

        /* 통통 튀는 맛집 이모지 마커 애니메이션 스타일 */
        .emoji-marker {
            font-size: 32px;
            cursor: pointer;
            filter: drop-shadow(0px 3px 4px rgba(0,0,0,0.15));
            animation: bounceEffect 0.6s ease infinite alternate;
        }
        @keyframes bounceEffect {
            from { transform: translateY(0); }
            to { transform: translateY(-7px); }
        }

        /* 말풍선 팝업(InfoWindow) 커스텀 디자인 */
        .info-window {
            padding: 12px; background: #fff;
            border-radius: 10px; font-size: 12px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            border: 2px solid #ffb300; min-width: 160px;
        }
        .info-window h4 { margin-bottom: 4px; color: #e67e22; font-size: 14px; }
        .info-window p { color: #555; font-size: 11px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <div class="search-box">
                <h3>✨ 맛집 탐색 대작전 ✨</h3>
                <div class="chick-decoration">🐥 삐약이들이 맛집을 찾아줄게! 🐥</div>
                <div class="search-form">
                    <input type="text" id="keyword" class="search-input" placeholder="🍔 음식, 🍕 동네, 🍰 키워드 입력" onkeypress="if(event.keyCode==13) searchPlaces()">
                    <button onclick="searchPlaces()" class="search-button">🔍</button>
                </div>
            </div>
            <div id="placesList">
                <p style="color: #bbb; text-align: center; margin-top: 40px; font-size: 14px;">🍭 맛있는 곳을 검색해봐 보양! 🍭</p>
            </div>
        </div>
        <div id="map" class="map-area"></div>
    </div>

    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=fa1a5e0e6d5309f6ae682b37eab50ca7&libraries=services&autoload=false"></script>
    
    <script>
        let map;
        let placesService;
        let customOverlays = []; // 이모지 마커 제어용 전역 배열
        let activeInfoWindow = null; // 열려있는 정보창 추적용 변수

        // API가 정상 로드된 후 내부 코드 컨트롤
        kakao.maps.load(function() {
            const mapContainer = document.getElementById('map');
            const mapOption = {
                center: new kakao.maps.LatLng(37.566826, 126.9786567), // 기본 베이스: 서울시청
                level: 5
            };

            map = new kakao.maps.Map(mapContainer, mapOption);
            placesService = new kakao.maps.Services.Places();

            // Geolocation 브라우저 권한 획득 확인 및 지도 센터 동기화
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const currentPos = new kakao.maps.LatLng(lat, lon);
                    
                    map.setCenter(currentPos);
                });
            }
        });

        // 사용자가 검색 액션을 취할 때 호출되는 트리거 함수
        function searchPlaces() {
            const keyword = document.getElementById('keyword').value;

            if (!keyword.replace(/^\s+|\s+$/g, '')) {
                alert('🐣 맛집 키워드를 쏙쏙 입력해 주세요!');
                return;
            }

            // 카카오 장소 검색 API 통신 연동
            placesService.keywordSearch(keyword, placesSearchCallback);
        }

        // 통신 성공/실패 여부를 분기처리하는 콜백 함수
        function placesSearchCallback(data, status, pagination) {
            if (status === kakao.maps.Services.Status.OK) {
                displayPlaces(data); // 데이터 바인딩 시동
            } else if (status === kakao.maps.Services.Status.ZERO_RESULT) {
                alert('🥺 삐약.. 검색 결과가 하나도 없대요.');
            } else if (status === kakao.maps.Services.Status.ERROR) {
                alert('🚨 앗! API 호출 오류가 발생했습니다.');
            }
        }

        // 지도 화면과 결과 리스트를 매핑하는 핵심 함수
        function displayPlaces(places) {
            const listEl = document.getElementById('placesList');
            const bounds = new kakao.maps.LatLngBounds(); 

            listEl.innerHTML = ''; // 기존 리스트 삭제
            clearMap(); // 지도에 렌더링된 마커 및 팝업 일괄 클리어

            for (let i = 0; i < places.length; i++) {
                const placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
                
                // 맛집 컨셉에 맞는 이모지 마커 등록
                addEmojiMarker(placePosition, places[i]); 
                const itemEl = getListItem(i
