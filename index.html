<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐥 냠냠 병아리의 맛집 탐색기 🐥</title>
    <style>
        /* 기본 스타일 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Malgun Gothic', dotum, sans-serif;
            /* 배경: 파스텔 톤의 연두색과 노란색 그라데이션 */
            background: linear-gradient(135deg, #f0fff0 0%, #fffacd 100%);
            overflow: hidden; /* 전체 페이지 스크롤 방지 */
        }

        /* 화면을 왼쪽과 오른쪽으로 2분할하는 컨테이너 */
        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* 왼쪽 사이드바 (검색창 + 결과 리스트) */
        .sidebar {
            width: 380px; /* 조금 더 넓게 수정 */
            height: 100%;
            background-color: rgba(255, 255, 255, 0.9); /* 약간 투명한 흰색 */
            border-right: 2px solid #ffe082; /* 연한 주황색 테두리 */
            display: flex;
            flex-direction: column;
            padding: 25px;
            z-index: 10;
            box-shadow: 3px 0 10px rgba(0,0,0,0.05);
            position: relative;
        }

        /* 사이드바 배경에 병아리 이모지 추가 (장식용) */
        .sidebar::before {
            content: '🐥';
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 40px;
            opacity: 0.3;
        }

        /* 제목 영역 */
        .app-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .app-title {
            font-size: 22px;
            color: #ff8f00; /* 진한 주황색 */
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* 검색창 영역 */
        .search-box {
            display: flex;
            margin-bottom: 25px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-radius: 25px; /* 둥근 검색창 */
            overflow: hidden;
        }

        .search-box input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #ffe082;
            border-right: none;
            border-radius: 25px 0 0 25px;
            outline: none;
            font-size: 15px;
        }

        .search-box input:focus {
            border-color: #ffb300;
        }

        .search-box button {
            padding: 12px 25px;
            background-color: #ffeb3b; /* 밝은 노란색 */
            border: 2px solid #ffe082;
            border-left: none;
            border-radius: 0 25px 25px 0;
            cursor: pointer;
            font-weight: bold;
            color: #5d4037; /* 갈색 글씨 */
            font-size: 15px;
            transition: background-color 0.2s;
        }

        .search-box button:hover {
            background-color: #fdd835;
        }

        /* 검색 결과 리스트 영역 (스크롤 가능) */
        .places-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
            padding-right: 5px;
        }

        /* 스크롤바 스타일링 (귀엽게) */
        .places-list::-webkit-scrollbar {
            width: 8px;
        }
        .places-list::-webkit-scrollbar-track {
            background: #fff8e1;
            border-radius: 4px;
        }
        .places-list::-webkit-scrollbar-thumb {
            background: #ffe082;
            border-radius: 4px;
        }

        /* 검색 결과 아이템 스타일 */
        .places-list li {
            padding: 18px 15px;
            border-bottom: 1px solid #fff8e1;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            border-radius: 10px;
            margin-bottom: 5px;
            display: flex;
            align-items: start;
            gap: 12px;
        }

        .places-list li:hover {
            background-color: #fffde7; /* 아주 연한 노란색 */
            transform: translateX(3px);
        }

        /* 결과 아이템 내 이모티콘 아이콘 */
        .place-icon {
            font-size: 20px;
            margin-top: 2px;
        }

        .place-info {
            flex: 1;
        }

        .places-list h5 {
            font-size: 17px;
            margin-bottom: 6px;
            color: #4e342e; /* 진한 갈색 */
            font-weight: bold;
        }

        .places-list p {
            font-size: 13px;
            color: #795548; /* 갈색 */
            line-height: 1.4;
        }

        /* 오른쪽 지도 영역 */
        .map-area {
            flex: 1;
            height: 100%;
            position: relative;
        }

        /* 카카오 지도 커스텀 오버레이 (마커 클릭 팝업) 스타일 */
        .custom-overlay {
            position: absolute;
            bottom: 15px; /* 마커 위에 뜨도록 조정 */
            left: 50%;
            transform: translateX(-50%);
            background-color: white;
            border: 2px solid #ffe082;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            z-index: 1;
            min-width: 250px;
            pointer-events: auto; /* 클릭 이벤트 허용 */
        }

        /* 오버레이 닫기 버튼 */
        .overlay-close {
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer;
            font-size: 16px;
            color: #999;
            font-weight: bold;
        }
        .overlay-close:hover {
            color: #ff6f00;
        }

        .overlay-title {
            font-size: 16px;
            font-weight: bold;
            color: #ff8f00;
            margin-bottom: 8px;
            padding-right: 20px; /* 닫기 버튼 자리 확보 */
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .overlay-address {
            font-size: 13px;
            color: #666;
            line-height: 1.4;
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <div class="app-header">
                <div class="app-title">🐥 냠냠 탐색기 🍕</div>
            </div>
            <div class="search-box">
                <input type="text" id="keywordInput" placeholder="강남역 삼겹살, 홍대 카페... ✨" onkeypress="if(event.keyCode==13) searchPlaces();">
                <button onclick="searchPlaces()">검색 🔍</button>
            </div>
            <ul id="placesList" class="places-list"></ul>
        </div>

        <div id="map" class="map-area"></div>
    </div>

    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=fa1a5e0e6d5309f6ae682b37eab50ca7&libraries=services&autoload=false"></script>
    
    <script>
        // 전역 변수 선언
        let map;
        let placesService;
        let markers = []; // 검색 결과 마커들을 저장할 배열
        let currentLocationMarker; // 현재 위치 마커
        let customOverlay; // 검색 결과 상세 팝업 (커스텀 오버레이)

        // 맛집 카테고리에 따른 이모지 맵핑 (간단하게)
        const categoryEmojis = {
            '음식점': '🍴',
            '한식': '🍚',
            '일식': '🍣',
            '중식': '🇨🇳',
            '양식': '🍝',
            '카페': '☕',
            '술집': '🍺',
            '디저트': '🍰'
        };

        // 카카오 지도 스크립트가 완전히 로드된 후 실행되도록 보장
        kakao.maps.load(function() {
            initMap();
        });

        // 지도 초기화 함수
        function initMap() {
            let mapContainer = document.getElementById('map'); 
            
            // 기본 중심 좌표 (위치 권한 거부 시 사용할 서울역 좌표)
            let defaultCenter = new kakao.maps.LatLng(37.554648, 126.972559);
            
            let mapOptions = {
                center: defaultCenter, // 지도의 중심좌표
                level: 4 // 맛집 탐색에 적당한 확대 레벨로 조정 (숫자가 작을수록 확대)
            };

            // 지도 생성
            map = new kakao.maps.Map(mapContainer, mapOptions);
            
            // 장소 검색 서비스 객체 생성
            placesService = new kakao.maps.services.Places();

            // 커스텀 오버레이 객체를 미리 생성해둡니다 (나중에 콘텐츠만 교체)
            customOverlay = new kakao.maps.CustomOverlay({
                map: null, // 처음에 안보이게
                position: null,
                zIndex: 3
            });

            // 사용자의 현재 위치 가져오기 시도
            getCurrentLocation();
        }

        // HTML5의 Geolocation으로 현재 위치를 가져오는 함수
        function getCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    let lat = position.coords.latitude;  
                    let lon = position.coords.longitude; 
                    
                    let locPosition = new kakao.maps.LatLng(lat, lon); 
                    
                    // 지도의 중심을 현재 위치로 이동
                    map.setCenter(locPosition);
                    
                    // 현재 위치에 특별한 마커 표시
                    displayCurrentLocationMarker(locPosition);
                    
                }, function(error) {
                    console.error("위치 정보를 가져오는데 실패했습니다.", error);
                    alert("🐥 위치 권한을 허용하지 않아 기본 위치(서울역)로 표시합니다.");
                });
            } else {
                alert("이 브라우저에서는 위치 정보(Geolocation)를 지원하지 않습니다.");
            }
        }

        // 현재 위치에 병아리 이모지 마커를 표시하는 함수
        function displayCurrentLocationMarker(locPosition) {
            // 기존 현재 위치 마커가 있다면 제거
            if (currentLocationMarker) {
                currentLocationMarker.setMap(null);
            }

            // 커스텀 오버레이로 현재 위치를 이모지로 표시
            let content = '<div style="font-size: 35px; animation: pulse 2s infinite;">🐥</div>';
            
            // CSS 애니메이션 추가 (깜빡거리는 효과)
            let style = document.createElement('style');
            style.type = 'text/css';
            style.innerHTML = '@keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }';
            document.getElementsByTagName('head')[0].appendChild(style);

            currentLocationMarker = new kakao.maps.CustomOverlay({
                map: map,
                position: locPosition,
                content: content,
                yAnchor: 1 // 마커의 하단이 좌표에 오도록 설정
            });
        }

        // 키워드 장소 검색을 요청하는 함수
        function searchPlaces() {
            let keyword = document.getElementById('keywordInput').value;

            if (!keyword.replace(/^\s+|\s+$/g, '')) {
                alert('🐥 맛집 키워드를 입력해주세요! (예: 강남역 삼겹살)');
                return false;
            }

            // 새로 검색을 시작하므로 기존 결과물 초기화
            clearOldResults();

            // 카카오 장소 검색 API 호출 (키워드 검색)
            placesService.keywordSearch(keyword, placesSearchCB);
        }

        // 장소검색이 완료됐을 때 호출되는 콜백 함수
        function placesSearchCB(data, status, pagination) {
            if (status === kakao.maps.services.Status.OK) {
                // 정상적으로 검색이 완료됐으면 검색 목록과 마커를 표출합니다
                displayPlaces(data);
            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                alert('🐥 검색 결과가 존재하지 않습니다. 다른 키워드로 검색해보세요!');
            } else if (status === kakao.maps.services.Status.ERROR) {
                alert('🐥 검색 결과 중 오류가 발생했습니다.');
            }
        }

        // 검색 결과 목록과 마커를 표출하는 함수
        function displayPlaces(places) {
            let listEl = document.getElementById('placesList');
            let bounds = new kakao.maps.LatLngBounds();
            
            for (let i = 0; i < places.length; i++) {
                // 마커를 생성하고 지도에 표시합니다
                let placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
                let marker = addEmojiMarker(placePosition, places[i]);
                
                // 검색된 장소 위치를 기준으로 지도 범위를 재설정하기 위해 LatLngBounds 객체에 좌표를 추가합니다
                bounds.extend(placePosition);

                // 왼쪽 사이드바에 추가할 리스트 아이템 HTML 생성
                let itemEl = document.createElement('li');
                let emoji = getCategoryEmoji(places[i].category_name);
                
                itemEl.innerHTML = `
                    <div class="place-icon">${emoji}</div>
                    <div class="place-info">
                        <h5>${places[i].place_name}</h5>
                        <p>${places[i].road_address_name ? places[i].road_address_name : places[i].address_name}</p>
                    </div>
                `;

                // 리스트 아이템을 클릭했을 때 해당 위치로 지도를 이동하고 팝업을 띄웁니다
                (function(marker, place) {
                    itemEl.onclick = function() {
                        map.panTo(marker.getPosition());
                        displayPlacePopup(marker, place);
                    };
                })(marker, places[i]);

                listEl.appendChild(itemEl);
            }

            // 검색된 장소들을 한눈에 볼 수 있도록 지도 범위를 변경합니다
            map.setBounds(bounds);
        }

        // 카테고리 이름에 맞는 이모지를 반환하는 함수
        function getCategoryEmoji(categoryName) {
            if (!categoryName) return '🍴'; // 기본 이모지

            for (let key in categoryEmojis) {
                if (categoryName.includes(key)) {
                    return categoryEmojis[key];
                }
            }
            return '🍴'; // 매칭되는 게 없으면 기본 음식 이모지
        }

        // 이모지 커스텀 마커를 생성하고 지도 위에 표시하는 함수
        function addEmojiMarker(position, place) {
            let emoji = getCategoryEmoji(place.category_name);
            
            // 마커 이미지 대신 이모지 텍스트를 담은 HTML 콘텐츠
            let content = `<div style="font-size: 28px; cursor: pointer;">${emoji}</div>`;

            // 커스텀 오버레이로 마커 구현
            let marker = new kakao.maps.CustomOverlay({
                position: position,
                content: content,
                yAnchor: 1, // 이모지 하단이 좌표에 위치하도록
                zIndex: 2
            });

            marker.setMap(map); // 지도에 표시
            markers.push(marker); // 배열에 저장

            // 마커(이모지) 클릭 시 상세 팝업 표시 이벤트 등록
            // 커스텀 오버레이 컨텐츠의 DOM 요소에 직접 이벤트를 달아줘야 함
            let markerElement = document.createElement('div');
            markerElement.innerHTML = content;
            markerElement.firstChild.onclick = function() {
                map.panTo(position); // 해당 위치로 지도 이동
                displayPlacePopup(marker, place);
            };
            marker.setContent(markerElement.firstChild); // 클릭 이벤트가 달린 DOM으로 교체

            return marker;
        }

        // 마커 클릭 시 이름, 주소 팝업(커스텀 오버레이)을 표시하는 함수
        function displayPlacePopup(marker, place) {
            let emoji = getCategoryEmoji(place.category_name);
            let address = place.road_address_name ? place.road_address_name : place.address_name;

            // 팝업 HTML 콘텐츠 작성
            let content = `
                <div class="custom-overlay">
                    <span class="overlay-close" onclick="closePopup()" title="닫기">×</span>
                    <div class="overlay-title">${emoji} ${place.place_name}</div>
                    <div class="overlay-address">${address}</div>
                </div>
            `;

            // 기존 오버레이 설정 업데이트
            customOverlay.setContent(content);
            customOverlay.setPosition(marker.getPosition());
            customOverlay.setMap(map); // 지도에 표시
        }

        // 팝업을 닫는 함수 (오버레이 내 닫기 버튼에서 호출)
        function closePopup() {
            customOverlay.setMap(null);
        }

        // 새로 검색할 때 기존 마커, 리스트, 팝업을 모두 지우는 함수
        function clearOldResults() {
            // 1. 지도 위 마커 모두 제거
            for (let i = 0; i < markers.length; i++) {
                markers[i].setMap(null);
            }
            markers = []; // 배열 초기화

            // 2. 왼쪽 리스트 초기화
            document.getElementById('placesList').innerHTML = '';

            // 3. 열려있는 팝업 닫기
            closePopup();
        }
    </script>
</body>
</html>
