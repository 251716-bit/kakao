<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐥 삐약삐약 맛집 탐색 지도 🐥</title>
    <style>
        /* 기본 레이아웃 및 폰트 설정 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; font-family: 'Malgun Gothic', sans-serif; background-color: #fff9e6; }
        
        .container { display: flex; width: 100%; height: 100%; }

        /* 왼쪽 사이드바 (귀여운 옐로우 테마) */
        .sidebar {
            width: 350px; height: 100%; background: #ffffff;
            display: flex; flex-direction: column; border-right: 2px solid #fee500;
            z-index: 2;
            box-shadow: 3px 0 10px rgba(0,0,0,0.05);
        }

        /* 화사하고 귀여운 노란색 검색 박스 */
        .search-box { 
            padding: 25px 20px; 
            background: linear-gradient(135deg, #fffde6 0%, #fee500 100%); 
            border-bottom: 2px dashed #ffa100;
            text-align: center;
        }
        .search-box h3 { 
            color: #4a3b00; 
            margin-bottom: 5px; 
            font-size: 20px;
            letter-spacing: -0.5px;
        }
        .chick-decoration {
            font-size: 14px;
            color: #6b5600;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .search-form { display: flex; gap: 6px; }
        .search-input { 
            flex: 1; padding: 12px; 
            border: 2px solid #ffb300; border-radius: 20px; 
            outline: none; font-size: 14px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
        }
        .search-input:focus { border-color: #e69d00; background-color: #fffdf0; }
        .search-button { 
            padding: 0 18px; background: #ffb300; color: #fff;
            border: none; border-radius: 20px; cursor: pointer; 
            font-weight: bold; font-size: 15px; transition: all 0.2s;
            box-shadow: 0 3px 6px rgba(255,179,0,0.3);
        }
        .search-button:hover { background: #e69d00; transform: scale(1.03); }

        /* 검색 결과 맛집 리스트 스타일 */
        #placesList { flex: 1; overflow-y: auto; padding: 10px; background-color: #fffdf7; }
        .place-item { 
            padding: 15px; margin-bottom: 8px;
            border: 1px solid #ffe699; border-radius: 12px; background: #fff;
            cursor: pointer; transition: all 0.2s;
        }
        .place-item:hover { 
            background-color: #fff9e6; transform: translateY(-2px); 
            box-shadow: 0 4px 8px rgba(255, 230, 153, 0.4); 
        }
        .place-item h5 { color: #333; margin-bottom: 5px; font-size: 15px; display: flex; align-items: center; gap: 4px; }
        .place-item p { font-size: 12px; color: #666; line-height: 1.4; }

        /* 오른쪽 지도 영역 */
        .map-area { flex: 1; height: 100%; background-color: #e5e5e5; }

        /* 통통 튀는 맛집 이모지 마커 애니메이션 스타일 */
        .emoji-marker {
            font-size: 32px;
            cursor: pointer;
            filter: drop-shadow(0px 3px 4px rgba(0,0,0,0.15));
            animation: bounceEffect 0.6s ease infinite alternate;
        }
        @keyframes bounceEffect {
            from { transform: translateY(0); }
            to { transform: translateY(-7px); }
        }

        /* 말풍선 팝업(InfoWindow) 커스텀 디자인 */
        .info-window {
            padding: 12px; background: #fff;
            border-radius: 10px; font-size: 12px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            border: 2px solid #ffb300; min-width: 160px;
        }
        .info-window h4 { margin-bottom: 4px; color: #e67e22; font-size: 14px; }
        .info-window p { color: #555; font-size: 11px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <div class="search-box">
                <h3>✨ 맛집 탐색 대작전 ✨</h3>
                <div class="chick-decoration">🐥 삐약이들이 맛집을 찾아줄게! 🐥</div>
                <div class="search-form">
                    <input type="text" id="keyword" class="search-input" placeholder="🍔 음식, 🍕 동네, 🍰 키워드 입력" onkeypress="if(event.keyCode==13) searchPlaces()">
                    <button onclick="searchPlaces()" class="search-button">🔍</button>
                </div>
            </div>
            <div id="placesList">
                <p style="color: #bbb; text-align: center; margin-top: 40px; font-size: 14px;">🍭 맛있는 곳을 검색해봐 보양! 🍭</p>
            </div>
        </div>
        <div id="map" class="map-area"></div>
    </div>

    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=fa1a5e0e6d5309f6ae682b37eab50ca7&libraries=services&autoload=false"></script>
    
    <script>
        let map;
        let placesService;
        let customOverlays = []; 
        let activeInfoWindow = null; 

        // 윈도우 창이 완전히 로드된 시점에 로직을 실행하여 깃허브 로딩 지연 문제 방지
        window.onload = function() {
            kakao.maps.load(initializeMap);
        };

        // 지도 및 서비스 초기화 함수
        function initializeMap() {
            const mapContainer = document.getElementById('map');
            const mapOption = {
                center: new kakao.maps.LatLng(37.566826, 126.9786567), // 기본값: 서울시청
                level: 5
            };

            // 우선 지도를 무조건 화면에 띄웁니다 (화면이 하얗게 굳는 현상 방지)
            map = new kakao.maps.Map(mapContainer, mapOption);
            placesService = new kakao.maps.Services.Places();

            // 지도 객체가 생성된 후, 현재 위치 권한을 안전하게 물어봅니다.
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const currentPos = new kakao.maps.LatLng(lat, lon);
                        
                        // 사용자가 허용하면 중심점을 내 위치로 이동
                        map.setCenter(currentPos);
                    },
                    function(error) {
                        // 권한 거부나 환경 에러 시 콘솔에만 기록하고 지도는 유지
                        console.log("위치 권한을 획득하지 못했으나 기본 지도를 표시합니다.", error);
                    },
                    { timeout: 10000 } // 10초 동안 응답 없으면 대기 취소
                );
            }
        }

        // 장소 검색 함수
        function searchPlaces() {
            const keyword = document.getElementById('keyword').value;

            if (!keyword.replace(/^\s+|\s+$/g, '')) {
                alert('🐣 맛집 키워드를 쏙쏙 입력해 주세요!');
                return;
            }

            placesService.keywordSearch(keyword, placesSearchCallback);
        }

        // 검색 결과 처리 콜백
        function placesSearchCallback(data, status, pagination) {
            if (status === kakao.maps.Services.Status.OK) {
                displayPlaces(data); 
            } else if (status === kakao.maps.Services.Status.ZERO_RESULT) {
                alert('🥺 삐약.. 검색 결과가 하나도 없대요.');
            } else if (status === kakao.maps.Services.Status.ERROR) {
                alert('🚨 앗! API 호출 오류가 발생했습니다.');
            }
        }

        // 화면 갱신 및 마커 표시
        function displayPlaces(places) {
            const listEl = document.getElementById('placesList');
            const bounds = new kakao.maps.LatLngBounds(); 

            listEl.innerHTML = ''; 
            clearMap(); 

            for (let i = 0; i < places.length; i++) {
                const placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
                
                addEmojiMarker(placePosition, places[i]); 
                const itemEl = getListItem(i, places[i]); 

                bounds.extend(placePosition);

                itemEl.onclick = function() {
                    map.panTo(placePosition);
                    openInfoWindow(placePosition, places[i]);
                };

                listEl.appendChild(itemEl);
            }

            map.setBounds(bounds);
        }

        // 이모지 커스텀 오버레이 생성
        function addEmojiMarker(position, place) {
            const content = document.createElement('div');
            content.className = 'emoji-marker';
            content.innerHTML = '🍔'; 

            content.onclick = function() {
                openInfoWindow(position, place);
            };

            const customOverlay = new kakao.maps.CustomOverlay({
                position: position,
                content: content,
                yAnchor: 1 
            });

            customOverlay.setMap(map);
            customOverlays.push(customOverlay); 
        }

        // 인포윈도우 오픈
        function openInfoWindow(position, place) {
            if (activeInfoWindow) {
                activeInfoWindow.close();
            }

            const addressName = place.road_address_name || place.address_name;
            const content = `
                <div class="info-window">
                    <h4>✨ ${place.place_name}</h4>
                    <p>📍 ${addressName}</p>
                </div>
            `;

            const infoWindow = new kakao.maps.InfoWindow({
                position: position,
                content: content,
                removable: true
            });

            infoWindow.open(map);
            activeInfoWindow = infoWindow; 
        }

        // 지도 클리어
        function clearMap() {
            for (let i = 0; i < customOverlays.length; i++) {
                customOverlays[i].setMap(null);
            }            
            customOverlays = [];

            if (activeInfoWindow) {
                activeInfoWindow.close();
                activeInfoWindow = null;
            }
        }

        // 결과 리스트 요소 생성
        function getListItem(index, place) {
            const el = document.createElement('div');
            el.className = 'place-item';
            el.innerHTML = `
                <h5>⭐ ${place.place_name}</h5>
                <p>🏠 ${place.road_address_name || place.address_name}</p>
            `;
            return el;
        }
    </script>
</body>
</html>
